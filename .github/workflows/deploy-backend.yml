name: Deploy Backend to Render

# mainブランチのbackend/配下が変更されたときに、Dockerイメージをビルドして
# GitHub Container Registry(ghcr.io)へpushし、Renderに再デプロイをトリガーする。
# RenderのGitHub App連携(組織への権限付与)を使わずにCI/CDするための仕組み。
on:
    push:
        branches: [main, deploy/production-setup]
        paths:
            - "backend/**"
            - ".github/workflows/deploy-backend.yml"
    workflow_dispatch: {}

env:
    IMAGE_NAME: ghcr.io/nxtend-the-hack/2026-team-02-backend

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Renderの「Deploy Hook」URLをGitHub Secretsに登録しておく必要がある。
            # これを叩くと、Render側は指定済みのイメージ(:latest)を取得し直して再デプロイする。
            - name: Trigger Render deploy
              run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
